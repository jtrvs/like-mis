{% extends "admin/base_site.html" %}

{% block breadcrumbs %}
<div class="breadcrumbs">
<a href="{% url 'admin:index' %}">Главная</a>
&rsaquo; Загрузка правил
</div>
{% endblock %}

{% block content %}
<div id="content-main">
    <form method="post">
        {% csrf_token %}
        <div>
            <fieldset class="module aligned">
                <h2>Загрузить новые правила (YAML)</h2>
                <div class="form-row">
                    <label for="file_type">Тип правил:</label>
                    <select name="file_type" id="file_type" required onchange="window.location.href = '?file_type=' + this.value;">
                        {% for code, label in file_types %}
                            <option value="{{ code }}" {% if code == default_file_type %}selected{% endif %}>
				{{ label }}
			    </option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-row">
                    <label for="content">Содержимое (YAML):</label>
			<textarea name="content" id="content" rows="20" style="width: 100%; font-family: monospace;" required>{{ initial_content }}</textarea>
                 </div>
                <div class="form-row">
                    <label for="comment">Комментарий (необязательно):</label>
                    <input type="text" name="comment" id="comment" style="width: 100%;">
                </div>
            </fieldset>
            <div class="submit-row">
                <input type="submit" value="Загрузить и активировать" class="default">
                <a href="{% url 'admin:index' %}" class="closelink">Отмена</a>
            </div>
        </div>
    </form>
</div>
{% endblock %}
