services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - prod_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.prod
    command: python manage.py migrate --noinput
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DEBUG: "False"
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  web:
    build:
      context: .
      dockerfile: Dockerfile.prod
    ports:
      - "8001:8000"  # Production на порту 8001, разработка остаётся на 8000
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DEBUG: "False"
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: always

  alerts-worker:   # раз в минуту: повтор неподтверждённых сигналов и передача резервному врачу
    build:
      context: .
      dockerfile: Dockerfile.prod
    command: python manage.py process_alerts --loop --interval 60
    env_file: .env          # ALERT_CHANNELS, TELEGRAM_BOT_TOKEN, PUBLIC_BASE_URL и т. д.
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

  backup:          # копия базы каждые 15 минут в папку ./backups, хранится сутки
    image: postgres:16-alpine
    command: /bin/sh /ops/backup.sh
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_HOST: db
      BACKUP_INTERVAL: 900
      BACKUP_KEEP: 96
    volumes:
      - ./ops:/ops:ro
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy
volumes:
  prod_postgres_data:
