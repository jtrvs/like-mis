code: gad7
title: GAD-7 (Шкала генерализованного тревожного расстройства)
period: последние 2 недели
instruction: Оцените, пожалуйста, насколько часто следующие проблемы беспокоили вас в течение прошедших двух недель.
items: 7
min_item: 0
max_item: 3
# Формулировки — дословно из валидированной русскоязычной версии (Золотарева, 2023).
answer_labels: [Совсем нет, В течение нескольких дней, Более чем половину этого времени, Почти каждый день]
item_labels:
  - Чувство тревоги или раздражения
  - Неспособность справиться со своим беспокойством
  - Чрезмерное беспокойство по разным поводам
  - Неспособность расслабляться
  - Ощущение такого беспокойства, что трудно найти себе место
  - Склонность быстро испытывать злость или раздражительность
  - Чувство страха, как будто может случиться что-то ужасное
critical_items: []
severity:
  - {from: 0, to: 4, code: minimal, label: Минимальная}
  - {from: 5, to: 9, code: mild, label: Лёгкая}
  - {from: 10, to: 14, code: moderate, label: Умеренная}
  - {from: 15, to: 21, code: severe, label: Тяжёлая}
source:
  original: Spitzer R.L. et al. A brief measure for assessing generalized anxiety disorder - the GAD-7. Arch Intern Med. 2006;166(10):1092-1097.
