code: hama
title: HAM-A (шкала тревоги Гамильтона)
filled_by: doctor
items: 14
min_item: 0
max_item: 4
answer_labels: [0 — нет, 1, 2, 3, 4 — очень сильно]
item_labels:
  - Тревожное настроение (озабоченность, ожидание наихудшего)
  - Напряжение (вздрагивания, плаксивость, беспокойство, дрожь)
  - Страхи (темноты, незнакомых людей, одиночества)
  - Инсомния (трудно заснуть, прерывистый сон, кошмары)
  - Интеллектуальные нарушения (концентрация, память)
  - Депрессивное настроение (снижение интереса, ангедония)
  - Соматические мышечные (боли в мышцах, бруксизм)
  - Соматические сенсорные (звон в ушах, нечёткость зрения)
  - Сердечно-сосудистые (тахикардия, боль в груди, предобморочность)
  - Респираторные (давление в груди, удушье, одышка)
  - Желудочно-кишечные (тошнота, запор, снижение веса)
  - Мочеполовые (учащённое мочеиспускание, дисменорея, импотенция)
  - Вегетативные (сухость во рту, приливы, бледность, потливость)
  - Поведение при беседе (беспокойство, тремор)
# Ориентировочные пороги выраженности — Matza L.S. et al., 2010 (Int J Methods Psychiatr Res 19(4):223-232);
# главное — динамика: снижение на 50% и больше от исходного = ответ на лечение.
severity:
  - {from: 0, to: 7, code: minimal, label: Минимальная}
  - {from: 8, to: 14, code: mild, label: Лёгкая}
  - {from: 15, to: 23, code: moderate, label: Умеренная}
  - {from: 24, to: 56, code: severe, label: Тяжёлая}
source:
  original: Hamilton M. The assessment of anxiety states by rating. Br J Med Psychol. 1959;32:50-55.
  license: свободная
  thresholds: Matza L.S., Morlock R., Sexton C. et al. Identifying HAM-A cutoffs for mild, moderate, and severe generalized anxiety disorder. Int J Methods Psychiatr Res. 2010;19(4):223-232.
