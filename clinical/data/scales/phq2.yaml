code: phq2
title: PHQ-2 (короткая еженедельная проверка — настроение)
derived_from: phq9      # первые 2 вопроса PHQ-9, формулировки берутся оттуда
items: 2
min_item: 0
max_item: 3
# 3 и больше — в тот же день предложить полный PHQ-9
severity:
  - {from: 0, to: 2, code: below, label: Ниже порога}
