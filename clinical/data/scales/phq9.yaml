code: phq9
title: PHQ-9 (Опросник здоровья пациента — депрессия)
period: последние 2 недели
instruction: Оцените, пожалуйста, насколько часто следующие проблемы беспокоили вас в течение прошедших двух недель.
items: 9
min_item: 0
max_item: 3
# Формулировки — дословно из валидированной русскоязычной версии (Золотарева, 2023, приложение).
answer_labels: [Совсем нет, В течение нескольких дней, Более чем половину этого времени, Почти каждый день]
item_labels:
  - Снижение интереса и удовольствия от привычных дел
  - Чувство подавленности или безнадежности
  - Проблемы со сном (неспособность заснуть, раннее пробуждение или слишком долгий сон)
  - Чувство усталости или недостатка энергии
  - Плохой аппетит или переедание
  - Плохое мнение о себе или чувство, что не смог оправдать ожиданий моей семьи
  - Проблемы с концентрацией внимания (например, при чтении газеты или просмотре телевизионной передачи)
  - Замедленность движений или речи, которая стала заметна другим людям, или, наоборот, суетливость, когда движения и речь стали более быстрыми и беспокойными
  - Мысли о том, что мне бы хотелось умереть или причинить себе боль
critical_items:
  - {index: 8, min_score: 1, flag: suicidal_ideation}
# Пороги и действия — по Kroenke 2001 (PHQ-9 Instruction Manual, Pfizer)
severity:
  - {from: 0, to: 4, code: minimal, label: Минимальная, action: Наблюдение}
  - {from: 5, to: 9, code: mild, label: Лёгкая, action: Наблюдение, повтор PHQ-9 на следующем визите}
  - {from: 10, to: 14, code: moderate, label: Умеренная, action: План лечения; рассмотреть психотерапию и/или фармакотерапию}
  - {from: 15, to: 19, code: moderately_severe, label: Умеренно тяжёлая, action: Активное лечение — фармакотерапия и/или психотерапия}
  - {from: 20, to: 27, code: severe, label: Тяжёлая, action: Фармакотерапия; при тяжёлых нарушениях или слабом ответе — к психиатру}
source:
  original: Kroenke K., Spitzer R.L., Williams J.B. The PHQ-9. J Gen Intern Med. 2001;16(9):606-613.
