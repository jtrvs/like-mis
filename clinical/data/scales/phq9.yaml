item_labels:
  - Мало интереса или удовольствия от занятий
  - Плохое настроение, подавленность, безнадёжность
  - Нарушения сна
  - Усталость, упадок сил
  - Нарушения аппетита
  - Плохое мнение о себе, чувство вины
  - Трудности с концентрацией
  - Замедленность или, наоборот, беспокойство
  - Мысли о том, что лучше умереть, или о причинении себе вреда
critical_items:
  - {index: 8, min_score: 1, flag: suicidal_ideation}
severity:
  - {from: 0, to: 4, code: minimal, label: Минимальная}
  - {from: 5, to: 9, code: mild, label: Лёгкая}
  - {from: 10, to: 14, code: moderate, label: Умеренная}
  - {from: 15, to: 19, code: moderately_severe, label: Умеренно тяжёлая}
  - {from: 20, to: 27, code: severe, label: Тяжёлая}
