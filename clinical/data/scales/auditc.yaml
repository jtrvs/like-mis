code: auditc
title: AUDIT-C (употребление алкоголя)
patient_title: Вопросы об алкоголе
period: последний год
instruction: "Одна доза (стандартная порция) — 10 г спирта: бокал вина 125 мл, 250 мл пива или 30 мл крепкого напитка."
items: 3
min_item: 0
max_item: 4
# Первые 3 вопроса теста ВОЗ AUDIT — дословно по официальной русской версии (auditscreen.org, ВОЗ).
item_labels:
  - Как часто Вы пьете алкогольные напитки?
  - Сколько доз Вы обычно выпиваете, когда пьете?
  - Как часто Вы употребляете 6 и более стандартных доз алкоголя в течение одного раза (выпивки)?
item_options:
  - [никогда, 1 раз в месяц, 1 раз в неделю, 2-4 раза в неделю, 4 и более раз в неделю]
  - [1-2, 3-4, 5-6, 7-9, 10 и более]
  - [никогда, реже 1 раза в месяц, раз в месяц, 1 раз в неделю, ежедневно или чаще]
answer_labels: []
# Риск: 4 и больше у мужчин, 3 и больше у женщин → предупреждение о безопасности терапии
risk_threshold: {M: 4, F: 3}
severity:
  - {from: 0, to: 12, code: score, label: Сумма баллов}
