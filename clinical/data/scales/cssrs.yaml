code: cssrs
title: Колумбийская шкала (C-SSRS), скрининговая версия
patient_title: Ещё несколько коротких вопросов
period: последний месяц
items: 7
min_item: 0
max_item: 1
answer_labels: [Нет, Да]
# Ответы «да / нет». Если на вопрос 2 «нет» — сразу к вопросу 6. Вопрос 6b — только если на 6 «да».
# Вопросы скрининговой версии (6 пунктов + уточнение «за 3 месяца»); русские формулировки — из официального
# перевода C-SSRS (Posner и соавт., Mapi Research Trust). Пациенту — скрининг; полную версию проводит обученный врач.
item_labels:
  - Возникало ли у Вас за последний месяц желание умереть или заснуть и не просыпаться?
  - Думали ли Вы за последний месяц в самом деле о том, чтобы покончить с собой?
  - Думали ли Вы о том, как могли бы это сделать?
  - Посещали ли Вас подобные мысли и было ли у Вас какое-нибудь намерение действовать в соответствии с ними?
  - Начали ли Вы разрабатывать или уже разработали детальный план? Намереваетесь ли Вы осуществить этот план?
  - Предпринимали ли Вы когда-либо какие-либо шаги, чтобы покончить с собой или приготовиться к этому (например, приобретали таблетки, раздавали ценные вещи, писали записку)?
  - Было ли это за последние 3 месяца?
skip_rules:
  - {if_item: 1, equals: 0, skip: [2, 3, 4]}
  - {if_item: 5, equals: 0, skip: [6]}
# Риск (таблица «Шкалы», бланк подсчёта C-SSRS):
#   низкий — «да» только на 1 и/или 2; умеренный — 3, или 6 давнее 3 месяцев; высокий — 4 или 5, или 6 за 3 месяца
severity:
  - {from: 0, to: 0, code: none, label: Риск не выявлен}
  - {from: 1, to: 1, code: low, label: Низкий риск}
  - {from: 2, to: 2, code: moderate, label: Умеренный риск}
  - {from: 3, to: 3, code: high, label: Высокий риск}
source:
  original: Posner K. et al. The Columbia–Suicide Severity Rating Scale. Am J Psychiatry. 2011;168(12):1266-1277.
  license: бесплатно для клинического применения, текст не менять (cssrs.columbia.edu)
  ru_validation: официальный русский перевод C-SSRS (Mapi Research Trust); скрининговая версия рекомендована для немедицинского персонала и самозаполнения
