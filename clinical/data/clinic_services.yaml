# Услуги клиники, которые система мягко предлагает пациенту ТОЛЬКО при клиническом поводе (не реклама):
# не больше одной карточки, пациент может скрыть её, заявка уходит лечащему врачу/администратору клиники.
# Набор услуг и цены настраивает клиника — без изменения кода.
services:
  - code: extra_visit
    title: Дополнительный приём у вашего врача
    text: Похоже, за неделю накопилось много вопросов. На приёме их удобнее обсудить спокойно и подробно.
    when: {fact: many_messages, op: is_true}
    source: Кастдев с психиатром — предложение доп. приёма при большом числе обращений

  - code: psychologist
    title: Консультация медицинского психолога
    text: Психотерапия хорошо дополняет лечение тревоги. Психолог работает вместе с вашим врачом.
    when: {any: [{fact: worse_marks_3d, op: gte, value: 2}, {all: [{fact: weeks_on_therapy, op: gte, value: 4}, {fact: score_improvement_pct, op: lt, value: 50}]}]}
    source: КР ГТР 2024 (ID 457) — КПТ как метод лечения; Приказ МЗ № 668н — роль медицинского психолога

  - code: cbt_course
    title: Курс когнитивно-поведенческой терапии (КПТ)
    text: Короткий структурированный курс помогает справляться с тревогой и закрепляет эффект лекарств.
    when: {all: [{fact: gad7_total, op: gte, value: 10}, {fact: weeks_on_therapy, op: gte, value: 2}]}
    source: КР ГТР 2024 (ID 457); КР «Паническое расстройство» 2024 (ID 456)
