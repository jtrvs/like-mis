# Источник: инструкция по медицинскому применению ЛП «Авиандр», РУ ЛП-№(002445)-(РГ-RU) от 31.05.2023.
# Сверено по vidal.ru/drugs/aviandr и medi.ru/instrukciya/aviandr_27908 (20.10.2026).
# TODO(Алина): сверить с текстом в ГРЛС (grls.rosminzdrav.ru) и поставить дату сверки.
code: aviandr
trade_name: Авиандр
inn: маритупирдин
atc: N05BX
group: анксиолитик (небензодиазепиновый)
rx_only: true
source:
  title: Инструкция по медицинскому применению ЛП Авиандр
  reg_number: ЛП-№(002445)-(РГ-RU)
  reg_date: 2023-05-31
  url: https://grls.rosminzdrav.ru/

forms:
  - {form: таблетки, покрытые плёночной оболочкой, strength_mg: 20}

indications:
  - icd10: [F41.1]
    title: Генерализованное тревожное расстройство
    duration: определяется врачом индивидуально (хроническое заболевание)
  - icd10: [F41.9, F43.9]
    requires: post_covid   # только если тревога связана с перенесённым COVID-19
    title: Тревожные состояния после COVID-19 у пациентов со стрессовой реакцией и нарушением адаптации лёгкой и средней степени
    duration: 4 недели, по решению врача до 6 недель
    max_weeks: 6

dosing:
  dose_mg: 20
  times_per_day: 2
  daily_max_mg: 40
  timing: утром и вечером, за 30 минут до еды

min_age: 18

contraindications:
  - {id: hypersensitivity, condition: allergy_maritupirdine, text: "Повышенная чувствительность к маритупирдину или вспомогательным веществам"}
  - {id: epilepsy, condition: epilepsy, text: "Эпилепсия"}
  - {id: organic_brain, condition: organic_brain_disease, text: "Органические заболевания головного мозга"}
  - {id: maoi, drug_class: maoi, washout_days: 14, text: "Одновременный приём ингибиторов МАО и 2 недели после их отмены"}
  - {id: renal, egfr_below: 60, condition: renal_failure, text: "Почечная недостаточность средней и тяжёлой степени (СКФ < 60 мл/мин)"}
  - {id: hepatic, child_pugh: [A, B, C], condition: hepatic_failure, text: "Печёночная недостаточность (классы A, B, C по Чайлд-Пью)"}
  - {id: pregnancy, pregnant: true, text: "Беременность"}
  - {id: lactation, breastfeeding: true, text: "Период грудного вскармливания (при необходимости приёма вскармливание прекращают)"}
  - {id: age, age_below: 18, text: "Возраст до 18 лет"}
  - {id: lactose, condition: lactose_intolerance, text: "Непереносимость лактозы, дефицит лактазы, глюкозо-галактозная мальабсорбция (препарат содержит лактозу)"}

cautions:
  - {id: cvd, condition: cardiovascular_disease, text: "Сердечно-сосудистые заболевания"}
  - {id: diabetes, condition: diabetes, text: "Сахарный диабет и другие эндокринные заболевания"}
  - {id: endocrine, condition: endocrine_disease, text: "Эндокринные заболевания"}
  - {id: addiction, condition: substance_dependence, text: "Алкогольная или наркотическая зависимость; возможны лекарственная зависимость и синдром отмены"}
  - {id: elderly, age_from: 65, text: "Пожилой возраст — выше чувствительность к нежелательным эффектам"}

interactions:
  - {drug_class: maoi, level: contraindication, text: "Ингибиторы МАО — сочетание недопустимо (в т.ч. 14 дней после отмены)"}
  - {drug_class: ssri, level: caution, text: "СИОЗС — риск серотонинового синдрома; часть СИОЗС ингибирует CYP2D6 и повышает концентрацию маритупирдина"}
  - {drug_class: tca, level: caution, text: "Трициклические антидепрессанты — риск серотонинового синдрома"}
  - {drug_class: triptan, level: caution, text: "Триптаны — риск серотонинового синдрома"}
  - {drug_class: serotonergic_other, level: caution, text: "Трамадол, фентанил, литий, L-триптофан, зверобой — риск серотонинового синдрома"}
  - {drug_class: sedative, level: caution, text: "Бензодиазепины, нейролептики, барбитураты, H1-блокаторы — усиление седации"}
  - {drug_class: cyp2d6_inhibitor, level: caution, text: "Ингибиторы CYP2D6 — повышение концентрации маритупирдина"}

warnings:
  - Не употреблять алкоголь (усиливает угнетающее действие этанола на ЦНС)
  - Управление транспортом и работа с механизмами — противопоказаны в период лечения
  - Возможны лекарственная зависимость и синдром отмены

adverse_effects:
  common: [сонливость, головная боль, головокружение, астения, парестезии]
  uncommon: [бессонница, ухудшение сна, усиление тревоги, нарушение внимания, нарушение вкуса, тошнота, боль в эпигастрии, запор, потливость, скованность мышц, тризм, боль в спине, повышение КФК, снижение гемоглобина]

# Нежелательные явления, которые в самоотчёте пациента поднимают сигнал врачу
monitor_side_effects: [сонливость, головокружение, усиление тревоги, бессонница]
