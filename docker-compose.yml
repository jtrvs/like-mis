services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
    depends_on:
      db:
        condition: service_healthy

  # --- роль 4 (Максим) ---
  alerts-worker:   # раз в минуту: повтор неподтверждённых сигналов и передача резервному врачу
    build: .
    command: python manage.py process_alerts --loop --interval 60
    volumes:
      - .:/app
    env_file: .env          # ALERT_CHANNELS, TELEGRAM_BOT_TOKEN, PUBLIC_BASE_URL и т. д.
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

  backup:          # копия базы каждые 15 минут в папку ./backups, хранится сутки
    image: postgres:16-alpine
    command: /bin/sh /ops/backup.sh
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_HOST: db
      BACKUP_INTERVAL: 900
      BACKUP_KEEP: 96
    volumes:
      - ./ops:/ops:ro
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
